name: CI/CD

permissions:
  contents: read
  packages: read

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  merge_group:

jobs:
  ci-cd:
    uses: HSLdevcom/transitdata-shared-workflows/.github/workflows/ci-cd-java.yml@1.0.7
    secrets: inherit
    with:
      runTestsInsideDocker: true
